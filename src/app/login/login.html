<div class="login-container">

    <div class="logo-section">

        <img src="costaneralogo.png" alt="Costanera Hotel">

    </div>

    <div class="form-section">

        <div class="login-card">

            <h2>Iniciar Sesión</h2>

            <div class="mensaje-error" *ngIf="mensajeError">

                {{ mensajeError }}

            </div>

            <input type="text" placeholder="Usuario" [(ngModel)]="username">

            <input type="password" placeholder="Contraseña" [(ngModel)]="password">

            <button type="button" (click)="ingresar()">

                INGRESAR

            </button>

        </div>

    </div>

</div>

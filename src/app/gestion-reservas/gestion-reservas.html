<app-recep-navbar></app-recep-navbar>

<div class="container mt-4 mb-5">

  <div class="row justify-content-center">

    <div class="col-lg-10">

      <div class="d-flex justify-content-between align-items-center mb-4">

        <h3 class="fw-semibold mb-0">Nueva Reserva</h3>

      </div>

      <div class="card shadow-sm border-0">

        <div class="card-body p-4 p-md-5">

          <form [formGroup]="reservaForm">

            <h6 class="text-uppercase text-muted fw-bold mb-3">
              1. Datos del Huésped
            </h6>

            <div class="row g-3 mb-4">

              <div class="col-md-3">
                <label class="form-label small fw-medium">
                  Tipo Doc.
                </label>

                <select class="form-select form-select-sm">
                  <option>DNI</option>
                  <option>Pasaporte</option>
                  <option>CE</option>
                </select>
              </div>

              <div class="col-md-3">
                <label class="form-label small fw-medium">
                  Número Documento
                </label>

                <input type="text" class="form-control form-control-sm">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-medium">
                  Nombres Completos
                </label>

                <input type="text" class="form-control form-control-sm">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-medium">
                  Apellidos Completos
                </label>

                <input type="text" class="form-control form-control-sm">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-medium">
                  Teléfono
                </label>

                <input type="text" class="form-control form-control-sm">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-medium">
                  Correo
                </label>

                <input type="email" class="form-control form-control-sm">
              </div>

              <div class="col-md-6">
                <label class="form-label small fw-medium">
                  Naacionalidad
                </label>

                <input type="text" class="form-control form-control-sm">
              </div>

            </div>

            <hr>

            <h6 class="text-uppercase text-muted fw-bold mb-3">
              2. Estancia y Habitación
            </h6>

            <div class="row g-3">

              <div class="col-md-4">

                <label class="form-label">
                  Check-In
                </label>

                <input type="datetime-local" formControlName="checkin" class="form-control form-control-sm">
              </div>

              <div class="col-md-4">

                <label class="form-label">
                  Check-Out
                </label>

                <input type="datetime-local" formControlName="checkout" class="form-control form-control-sm">
              </div>

              <div class="col-md-4">

                <label class="form-label text-primary">
                  Habitación Disponible
                </label>

                <select formControlName="habitacion" class="form-select form-select-sm">

                  <option value="">
                    Seleccione habitación...
                  </option>

                  <option *ngFor="let hab of habitacionesDisponibles" [value]="hab.idHabitacion">

                    Habitación {{ hab.numero }}

                  </option>

                </select>

                <div class="col-md-4">

                  <label class="form-label">

                    Cantidad de Huéspedes

                  </label>

                  <input type="number" min="1" formControlName="cantidadHuespedes" class="form-control form-control-sm">

                </div>

              </div>

              <div class="col-md-12">

                <label class="form-label">

                  Observaciones

                </label>

                <textarea formControlName="observaciones" class="form-control form-control-sm">

  </textarea>

              </div>

            </div>

            <div class="d-flex justify-content-end gap-2 mt-5">

              <button type="button" class="btn btn-light border">

                Cancelar

              </button>

              <button type="button" (click)="confirmarReserva()" class="btn btn-dark">

                Confirmar Reserva

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
